<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollinations AI - Full Demo</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #374151;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
            font-size: 32px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .tab-content {
            display: none;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #d1d5db;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px;
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #111827;
            border: 1px dashed var(--border);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .row > div {
            flex: 1;
        }

        button.primary-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        button.primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        button.primary-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #111827;
            border-radius: 8px;
            border: 1px solid var(--border);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
        }

        .result-box img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .status {
            color: #fbbf24;
            font-weight: 500;
            display: none;
        }

        .error {
            color: #ef4444;
            font-weight: 500;
            word-break: break-all;
        }
        
        .global-settings {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pollinations AI - Premium Demo</h1>
    <p class="subtitle">Complete testing suite for Text Generation, Image Generation, and Image Editing/Inpainting.</p>

    <!-- Global API Key -->
    <div class="global-settings">
        <label>Pollinations API Key (Optional for some endpoints, required for Edit/Mask)</label>
        <input type="password" id="global-api-key" placeholder="Enter API Key (sk_... or pk_...)" autocomplete="new-password">
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-text')">Text Generation</button>
        <button class="tab-btn" onclick="switchTab('tab-image-gen')">Create Image</button>
        <button class="tab-btn" onclick="switchTab('tab-image-edit')">Edit / Mask Image</button>
    </div>

    <!-- 1. Text Generation -->
    <div id="tab-text" class="tab-content active">
        <div class="form-group">
            <label>Text Model</label>
            <select id="text-models">
                <option value="openai">OpenAI (Default)</option>
                <!-- Dynamically loaded -->
            </select>
        </div>
        <div class="form-group">
            <label>Prompt</label>
            <textarea id="text-prompt" placeholder="Write a short poem about coding..."></textarea>
        </div>
        <button class="primary-btn" id="btn-gen-text">Generate Text</button>

        <div class="result-box">
            <div id="status-text" class="status">Generating text...</div>
            <div id="error-text" class="error"></div>
            <div id="result-text" style="white-space: pre-wrap; width: 100%;"></div>
        </div>
    </div>

    <!-- 2. Create Image -->
    <div id="tab-image-gen" class="tab-content">
        <div class="form-group">
            <label>Image Model</label>
            <select id="image-models">
                <option value="flux">Flux (Default)</option>
                <!-- Dynamically loaded -->
            </select>
        </div>
        
        <div class="form-group">
            <label>Prompt</label>
            <textarea id="image-prompt" placeholder="A futuristic cyberpunk city at sunset, 8k resolution..."></textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Aspect Ratio Preset</label>
                <select id="image-ratio" onchange="updateDimensions()">
                    <option value="1:1" data-w="1024" data-h="1024">Square (1:1)</option>
                    <option value="16:9" data-w="1024" data-h="576">Widescreen (16:9)</option>
                    <option value="9:16" data-w="576" data-h="1024">Portrait (9:16)</option>
                    <option value="custom" data-w="1024" data-h="1024">Custom</option>
                </select>
            </div>
            <div class="form-group">
                <label>Width</label>
                <input type="number" id="image-w" value="1024" disabled>
            </div>
            <div class="form-group">
                <label>Height</label>
                <input type="number" id="image-h" value="1024" disabled>
            </div>
        </div>

        <div class="form-group">
            <label>Seed (Optional)</label>
            <input type="number" id="image-seed" placeholder="Leave blank for random">
        </div>

        <button class="primary-btn" id="btn-gen-image">Generate Image</button>

        <div class="result-box">
            <div id="status-image" class="status">Generating image...</div>
            <div id="error-image" class="error"></div>
            <img id="result-image" style="display: none;" />
        </div>
    </div>

    <!-- 3. Edit / Mask Image -->
    <div id="tab-image-edit" class="tab-content">
        <div class="row">
            <div class="form-group">
                <label>Base Image (Required)</label>
                <input type="file" id="edit-base" accept="image/png, image/jpeg">
            </div>
            <div class="form-group">
                <label>Mask Image (Optional for Inpainting)</label>
                <input type="file" id="edit-mask" accept="image/png, image/jpeg">
            </div>
        </div>

        <div class="form-group">
            <label>Edit Prompt</label>
            <textarea id="edit-prompt" placeholder="What to change or add? e.g. Add a red sports car..."></textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Size (e.g. 1024x1024)</label>
                <select id="edit-size">
                    <option value="1024x1024">1024x1024</option>
                    <option value="512x512">512x512</option>
                </select>
            </div>
            <div class="form-group">
                <label>Model</label>
                <input type="text" id="edit-model" value="flux" placeholder="flux, turbo...">
            </div>
        </div>

        <button class="primary-btn" id="btn-edit-image">Edit Image</button>

        <div class="result-box">
            <div id="status-edit" class="status">Editing image... this requires an API Key for OpenAI-compatible endpoint.</div>
            <div id="error-edit" class="error"></div>
            <img id="result-edit" style="display: none;" />
        </div>
    </div>

</div>

<script>
    // Tab Switching Logic
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    // Aspect Ratio Logic
    function updateDimensions() {
        const sel = document.getElementById('image-ratio');
        const opt = sel.options[sel.selectedIndex];
        const wInput = document.getElementById('image-w');
        const hInput = document.getElementById('image-h');

        if (opt.value === 'custom') {
            wInput.disabled = false;
            hInput.disabled = false;
        } else {
            wInput.value = opt.dataset.w;
            hInput.value = opt.dataset.h;
            wInput.disabled = true;
            hInput.disabled = true;
        }
    }

    // Load Models on Startup
    async function loadModels() {
        try {
            // Load Text Models
            const tRes = await fetch('https://gen.pollinations.ai/text/models');
            if (tRes.ok) {
                const tModels = await tRes.json();
                const sel = document.getElementById('text-models');
                sel.innerHTML = tModels.map(m => `<option value="${m.name || m}">${m.name || m}</option>`).join('');
                sel.value = 'openai'; // default
            }

            // Load Image Models
            const iRes = await fetch('https://gen.pollinations.ai/image/models');
            if (iRes.ok) {
                const iModels = await iRes.json();
                const sel = document.getElementById('image-models');
                sel.innerHTML = iModels.map(m => `<option value="${m.name || m}">${m.name || m} ${m.description ? ' - ' + m.description : ''}</option>`).join('');
                sel.value = 'flux'; // default
            }
        } catch (e) {
            console.error("Failed to load models:", e);
        }
    }

    // 1. Text Generation
    document.getElementById('btn-gen-text').addEventListener('click', async () => {
        const prompt = document.getElementById('text-prompt').value.trim();
        const model = document.getElementById('text-models').value;
        const apiKey = document.getElementById('global-api-key').value.trim();
        
        const status = document.getElementById('status-text');
        const error = document.getElementById('error-text');
        const result = document.getElementById('result-text');
        const btn = document.getElementById('btn-gen-text');

        if (!prompt) return;

        btn.disabled = true;
        status.style.display = 'block';
        error.innerText = '';
        result.innerText = '';

        try {
            const headers = { 'Content-Type': 'application/json' };
            if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;

            const res = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: 'user', content: prompt }]
                })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || "Generation failed.");

            result.innerText = data.choices[0].message.content;
        } catch (err) {
            error.innerText = err.message;
        } finally {
            btn.disabled = false;
            status.style.display = 'none';
        }
    });

    // 2. Image Generation
    document.getElementById('btn-gen-image').addEventListener('click', async () => {
        const prompt = document.getElementById('image-prompt').value.trim();
        const model = document.getElementById('image-models').value;
        const w = document.getElementById('image-w').value;
        const h = document.getElementById('image-h').value;
        const seedInput = document.getElementById('image-seed').value.trim();
        const apiKey = document.getElementById('global-api-key').value.trim();
        
        const status = document.getElementById('status-image');
        const error = document.getElementById('error-image');
        const result = document.getElementById('result-image');
        const btn = document.getElementById('btn-gen-image');

        if (!prompt) return;

        const seed = seedInput ? parseInt(seedInput) : Math.floor(Math.random() * 100000);

        btn.disabled = true;
        status.style.display = 'block';
        error.innerText = '';
        result.style.display = 'none';

        try {
            const encodedPrompt = encodeURIComponent(prompt);
            // using the direct URL method because it's the fastest and standard way for Pollinations
            let url = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${w}&height=${h}&seed=${seed}&model=${model}&nologo=true`;
            
            // To pass API key for premium, we can either pass ?key= or use headers. We'll use fetch.
            if (apiKey) url += `&key=${apiKey}`;

            const res = await fetch(url);
            if (!res.ok) throw new Error("Failed to generate image.");

            const blob = await res.blob();
            result.src = URL.createObjectURL(blob);
            result.onload = () => {
                result.style.display = 'block';
            };
        } catch (err) {
            error.innerText = err.message;
        } finally {
            btn.disabled = false;
            status.style.display = 'none';
        }
    });

    // 3. Edit / Mask Image
    document.getElementById('btn-edit-image').addEventListener('click', async () => {
        const prompt = document.getElementById('edit-prompt').value.trim();
        const baseFile = document.getElementById('edit-base').files[0];
        const maskFile = document.getElementById('edit-mask').files[0];
        const size = document.getElementById('edit-size').value;
        const model = document.getElementById('edit-model').value.trim();
        const apiKey = document.getElementById('global-api-key').value.trim();
        
        const status = document.getElementById('status-edit');
        const error = document.getElementById('error-edit');
        const result = document.getElementById('result-edit');
        const btn = document.getElementById('btn-edit-image');

        if (!baseFile || !prompt) {
            error.innerText = "Base image and prompt are required.";
            return;
        }

        btn.disabled = true;
        status.style.display = 'block';
        error.innerText = '';
        result.style.display = 'none';

        try {
            const formData = new FormData();
            formData.append('image', baseFile);
            formData.append('prompt', prompt);
            if (maskFile) formData.append('mask', maskFile);
            if (size) formData.append('size', size);
            if (model) formData.append('model', model);

            const headers = {};
            // v1/images/edits REQUIRES an API key
            if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;

            const res = await fetch('https://gen.pollinations.ai/v1/images/edits', {
                method: 'POST',
                headers: headers,
                body: formData
            });

            const data = await res.json();
            
            if (!res.ok) {
                throw new Error(data.error?.message || "Failed to edit image. Make sure you entered a valid API Key.");
            }

            if (data.data && data.data.length > 0) {
                result.src = data.data[0].url;
                result.onload = () => {
                    result.style.display = 'block';
                };
            } else {
                throw new Error("No image data returned.");
            }

        } catch (err) {
            error.innerText = err.message;
        } finally {
            btn.disabled = false;
            status.style.display = 'none';
        }
    });

    // Init
    loadModels();
</script>

</body>
</html>
