<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Gemini Text API Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --bg-color: #0f111a;
            --surface-color: #1a1d2d;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .flex-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 47px;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
        }

        #result-container {
            margin-top: 24px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            min-height: 100px;
            display: none;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .status {
            font-size: 13px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status.success { color: var(--success-color); }
        .status.error { color: var(--error-color); }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class='bx bxl-google'></i> Gemini Text API Tester</h1>
        <p>Dynamically load models & generate text completions</p>
    </div>

    <!-- API Key Section -->
    <div class="form-group">
        <label for="apiKey">1. Enter Gemini API Key</label>
        <div class="flex-row">
            <input type="password" id="apiKey" class="input-field" placeholder="AIzaSy..." spellcheck="false">
            <button id="btnFetchModels" class="btn btn-secondary">
                <i class='bx bx-cloud-download'></i> Fetch Models
            </button>
        </div>
        <div id="authStatus" class="status"></div>
    </div>

    <!-- Model Selection Section (Hidden Initially) -->
    <div id="modelSection" class="form-group" style="display: none; margin-top: 24px;">
        <label for="modelSelect">2. Select a Text Model</label>
        <select id="modelSelect" class="input-field">
            <!-- Populated dynamically -->
        </select>
    </div>

    <!-- Prompt Section (Hidden Initially) -->
    <div id="promptSection" style="display: none; margin-top: 24px;">
        <div class="form-group">
            <label for="promptInput">3. Enter your Prompt</label>
            <textarea id="promptInput" class="input-field" rows="4" placeholder="Hello! Can you write a short poem about coding?"></textarea>
        </div>
        
        <button id="btnGenerate" class="btn" style="width: 100%;">
            <i class='bx bx-send'></i> Generate Text
        </button>
    </div>

    <!-- Result Display -->
    <div id="result-container"></div>
</div>

<script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
  }
</script>

<script type="module">
    import { GoogleGenerativeAI } from '@google/generative-ai';

    const apiKeyInput = document.getElementById('apiKey');
    const btnFetchModels = document.getElementById('btnFetchModels');
    const authStatus = document.getElementById('authStatus');
    
    const modelSection = document.getElementById('modelSection');
    const modelSelect = document.getElementById('modelSelect');
    
    const promptSection = document.getElementById('promptSection');
    const promptInput = document.getElementById('promptInput');
    const btnGenerate = document.getElementById('btnGenerate');
    const resultContainer = document.getElementById('result-container');

    // 1. Fetch Models
    btnFetchModels.addEventListener('click', async () => {
        const key = apiKeyInput.value.trim();
        if (!key) {
            authStatus.innerHTML = `<i class='bx bx-error-circle'></i> Please enter an API key first.`;
            authStatus.className = 'status error';
            return;
        }

        btnFetchModels.disabled = true;
        btnFetchModels.innerHTML = `<span class="loader"></span> Fetching...`;
        authStatus.innerHTML = '';

        try {
            // Using direct REST API to list models because the SDK doesn't natively expose listModels()
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "Invalid API Key or network error.");
            }

            // Filter models that support generateContent
            const textModels = data.models.filter(m => 
                m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent")
            );

            if (textModels.length === 0) {
                throw new Error("No compatible text models found for this API key.");
            }

            // Populate Dropdown
            modelSelect.innerHTML = textModels.map(m => {
                const modelName = m.name.replace('models/', '');
                return `<option value="${modelName}">${m.displayName} (${modelName})</option>`;
            }).join('');

            // Try to auto-select a good default model like gemini-1.5-flash
            const defaultModelIndex = Array.from(modelSelect.options).findIndex(opt => opt.value.includes('1.5-flash'));
            if (defaultModelIndex !== -1) modelSelect.selectedIndex = defaultModelIndex;

            authStatus.innerHTML = `<i class='bx bx-check-circle'></i> Successfully loaded ${textModels.length} models.`;
            authStatus.className = 'status success';

            // Reveal sections
            modelSection.style.display = 'block';
            promptSection.style.display = 'block';

        } catch (error) {
            authStatus.innerHTML = `<i class='bx bx-error-circle'></i> ${error.message}`;
            authStatus.className = 'status error';
            modelSection.style.display = 'none';
            promptSection.style.display = 'none';
        } finally {
            btnFetchModels.disabled = false;
            btnFetchModels.innerHTML = `<i class='bx bx-cloud-download'></i> Fetch Models`;
        }
    });

    // 2. Generate Text
    btnGenerate.addEventListener('click', async () => {
        const key = apiKeyInput.value.trim();
        const selectedModel = modelSelect.value;
        const prompt = promptInput.value.trim();

        if (!prompt) {
            alert("Please enter a prompt.");
            return;
        }

        btnGenerate.disabled = true;
        btnGenerate.innerHTML = `<span class="loader"></span> Generating...`;
        
        resultContainer.style.display = 'block';
        resultContainer.innerHTML = `<span style="color:var(--text-secondary);"><span class="loader" style="width:14px;height:14px;border-width:2px;margin-right:8px;"></span> Contacting Google Gemini...</span>`;
        resultContainer.style.border = '1px solid var(--border-color)';

        try {
            // Initialize SDK
            const genAI = new GoogleGenerativeAI(key);
            const model = genAI.getGenerativeModel({ model: selectedModel });

            // Generate Content
            const result = await model.generateContent(prompt);
            const text = result.response.text();

            resultContainer.innerHTML = text;
            resultContainer.style.border = '1px solid var(--success-color)';
        } catch (error) {
            resultContainer.innerHTML = `<span style="color: var(--error-color);"><i class='bx bx-error-circle'></i> Error: ${error.message}</span>`;
            resultContainer.style.border = '1px solid var(--error-color)';
        } finally {
            btnGenerate.disabled = false;
            btnGenerate.innerHTML = `<i class='bx bx-send'></i> Generate Text`;
        }
    });
</script>

</body>
</html>
