<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puter AI Studio Demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">Puter AI Studio ✨</div>
            <nav>
                <button class="nav-btn active" data-mode="generate">Generate</button>
                <button class="nav-btn" data-mode="edit">Edit (Prompt)</button>
                <button class="nav-btn" data-mode="mask">Edit (Mask)</button>
            </nav>
        </header>

        <main>
            <div class="controls-panel">
                <div class="control-group">
                    <label for="model-select">AI Model</label>
                    <select id="model-select">
                        <option value="gemini-2.5-flash-image-preview">Gemini 2.5 Flash (Nano Banana)</option>
                        <option value="dall-e-3">DALL-E 3</option>
                        <option value="gpt-image-2">GPT Image 2</option>
                        <option value="black-forest-labs/flux-schnell">Flux.1 Schnell</option>
                        <option value="stabilityai/stable-diffusion-3-medium">Stable Diffusion 3</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="aspect-ratio">Aspect Ratio</label>
                    <select id="aspect-ratio">
                        <option value="">Default</option>
                        <option value="1:1">1:1 (Square)</option>
                        <option value="16:9">16:9 (Landscape)</option>
                        <option value="9:16">9:16 (Portrait)</option>
                        <option value="4:3">4:3</option>
                        <option value="3:4">3:4</option>
                    </select>
                </div>

                <div class="control-group" id="dimensions-group">
                    <label>Custom Size (Optional)</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="number" id="img-width" class="custom-input" placeholder="Width (e.g. 1024)">
                        <input type="number" id="img-height" class="custom-input" placeholder="Height (e.g. 1024)">
                    </div>
                </div>

                <div class="control-group">
                    <label for="prompt-input">Prompt</label>
                    <textarea id="prompt-input" placeholder="Describe the image you want to create..."></textarea>
                </div>

                <!-- Only visible in edit/mask modes -->
                <div class="control-group file-upload" id="image-upload-group" style="display: none;">
                    <label>Source Image</label>
                    <div class="upload-area" id="upload-area">
                        <span>Click or Drag & Drop an image here</span>
                        <input type="file" id="image-upload" accept="image/*" hidden>
                    </div>
                </div>

                <!-- Tools for Mask Mode -->
                <div class="control-group mask-tools" id="mask-tools-group" style="display: none;">
                    <label>Brush Size</label>
                    <input type="range" id="brush-size" min="5" max="50" value="20">
                    <button class="action-btn secondary" id="clear-mask-btn">Clear Mask</button>
                </div>

                <button class="action-btn primary" id="run-btn">Run AI</button>
            </div>

            <div class="workspace-panel">
                <!-- Workspace for viewing/editing source image -->
                <div class="workspace-view" id="workspace-view" style="display: none;">
                    <div class="canvas-container" id="canvas-container">
                        <canvas id="source-canvas"></canvas>
                        <canvas id="mask-canvas"></canvas>
                    </div>
                </div>

                <!-- Result View -->
                <div class="result-view" id="result-view">
                    <div class="placeholder" id="result-placeholder">
                        <div class="sparkles">✨</div>
                        <p>Your AI creation will appear here</p>
                    </div>
                    <div class="loading-overlay" id="loading-overlay">
                        <div class="spinner"></div>
                        <p>Processing with Puter...</p>
                    </div>
                    <div id="result-container"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
